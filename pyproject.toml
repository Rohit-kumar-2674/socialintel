[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socialintel-framework"
version = "0.1.0"
description = "Local public-source investigations with attributed evidence and explicit uncertainty."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Rocky"}]
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.7,<3",
  "SQLAlchemy>=2.0,<3", "httpx==0.28.1", "httpcore[asyncio]==1.0.9",
  "beautifulsoup4>=4.12,<5", "typer>=0.15,<1", "rich>=13,<16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
socialintel = "socialintel.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
socialintel = ["web/*", "web/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
