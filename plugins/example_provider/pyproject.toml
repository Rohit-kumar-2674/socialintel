[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socialintel-example-provider"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reviewed SDK example: public HTML metadata from example.org only"
dependencies = ["socialintel-framework>=0.1.0,<0.2"]

[tool.setuptools.packages.find]
where = ["src"]
